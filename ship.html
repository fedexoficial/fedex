<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar Envio | FedEx</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="static/styles.css" />
</head>
<body data-page="ship">
  <div class="noise" aria-hidden="true"></div>
  <header class="site-header">
    <div class="container nav">
      <a href="index.html" class="brand" aria-label="Página inicial da FedEx">
        <img class="brand-logo-png" src="static/images/fedex-logo.png" alt="Logo da FedEx" />
      </a>
      <nav>
        <a href="index.html">Início</a>
        <a href="ship.html">Enviar Agora</a>
        <a href="world-map.html">Mapa ao Vivo</a>
</nav>
</div>
  </header>

  <main>
    <div class="container flash-wrap" id="flash-container"></div>
    <section class="section">
      <div class="container split">
        <div>
          <p class="eyebrow">Formulário de envio do usuário</p>
          <h2>Criar envio de pacote</h2>
          <p>As coordenadas são necessárias para que a página de rastreamento renderize o mapa da rota da origem ao destino.</p>
        </div>
        <form class="panel" id="ship-form">
          <div class="grid-two">
            <label>Nome do remetente<input name="sender_name" required /></label>
            <label>Email do remetente<input name="sender_email" type="email" /></label>
            <label>Telefone do remetente<input name="sender_phone" /></label>
            <label>Local de origem<input name="origin_label" placeholder="Nova York, EUA" required /></label>
            <label>Latitude de origem<input name="origin_lat" type="number" step="any" required /></label>
            <label>Longitude de origem<input name="origin_lng" type="number" step="any" required /></label>
            <label>Nome do destinatário<input name="receiver_name" required /></label>
            <label>Email do destinatário<input name="receiver_email" type="email" /></label>
            <label>Telefone do destinatário<input name="receiver_phone" /></label>
            <label>Local de destino<input name="destination_label" placeholder="Toronto, Canadá" required /></label>
            <label>Latitude de destino<input name="destination_lat" type="number" step="any" required /></label>
            <label>Longitude de destino<input name="destination_lng" type="number" step="any" required /></label>
            <label>Peso (kg)<input name="weight_kg" type="number" min="0.1" step="0.1" required /></label>
            <label>Serviço
              <select name="service_level" required>
                <option value="same-day">Mesmo dia</option>
                <option value="express">Expresso</option>
                <option value="standard">Padrão</option>
                <option value="international">Internacional</option>
              </select>
            </label>
          </div>
          <label>Descrição da encomenda<input name="package_description" required placeholder="Documentos, eletrônicos, roupas" /></label>
          <button class="btn" type="submit">Registrar envio</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-wrap">
      <p>© 2026 FedEx Logistics</p>
      <p>Operações de envio, rastreamento e entrega</p>
    </div>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
